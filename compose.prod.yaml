# Full deployment: `docker compose -f compose.prod.yaml up -d --build`
# Set ORIGIN to the public https URL (baked in at build time; used for CSRF checks) and change the secrets.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: coffee
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffee -d coffee']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://coffee:${POSTGRES_PASSWORD}@db:5432/coffee
      REGISTRATION: ${REGISTRATION:-invite}
      INVITE_CODE: ${INVITE_CODE:-}
      # Behind a reverse proxy, take the client IP from X-Forwarded-For (rate limiting is per IP).
      # XFF_DEPTH = number of trusted proxies in front of the app. Remove both if exposed directly.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-X-Forwarded-For}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    ports:
      - 3000:3000

volumes:
  pgdata:
