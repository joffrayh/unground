# Full deployment: `docker compose -f compose.prod.yaml up -d --build`
# Reads DOMAIN, POSTGRES_PASSWORD, INVITE_CODE (and optionally REGISTRATION) from `.env` next to this file.
# Caddy terminates TLS (automatic Let's Encrypt certificate for DOMAIN); only ports 80/443 are published.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: coffee
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffee -d coffee']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        # Baked in at build time; used for CSRF checks.
        ORIGIN: https://${DOMAIN:?set DOMAIN}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://coffee:${POSTGRES_PASSWORD}@db:5432/coffee
      REGISTRATION: ${REGISTRATION:-invite}
      INVITE_CODE: ${INVITE_CODE:-}
      # Client IP for rate limiting comes from Caddy's X-Forwarded-For (one trusted proxy).
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
